services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roveran
      POSTGRES_USER: roveran
      POSTGRES_PASSWORD: roveran
    ports: ['127.0.0.1:54329:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roveran']
      interval: 5s
      timeout: 3s
      retries: 10
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: roveran-local
      RUSTFS_SECRET_KEY: roveran-local-secret
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['image-data:/data', 'image-logs:/logs']
volumes:
  postgres-data:
  image-data:
  image-logs:

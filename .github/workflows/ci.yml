name: CI and Deploy

on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code quality and Python parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:fetch
      - run: pnpm format:check
      - run: pnpm check
      - run: python -m pip install -r tests/requirements.txt
      - run: pnpm test:parity
      - name: Save parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-parity
          path: tests/parity-report.json
          if-no-files-found: ignore
          retention-days: 14

  browsers:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:e2e --project=${{ matrix.browser }}
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.browser }}
          path: |
            test-results/
            tests/reports/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  build-pages:
    name: Build GitHub Pages site
    needs: [checks, browsers]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build at the repository URL
        env:
          OPENCV_WEBLAB_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist
      - name: Package the static site for releases
        if: github.event_name == 'release'
        run: |
          mkdir -p release
          tar -C apps/web/dist -czf release/opencv-weblab-static.tar.gz .
          cd release
          sha256sum opencv-weblab-static.tar.gz > SHA256SUMS
      - name: Save release package
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-site
          path: release/
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    name: Publish release downloads
    needs: [build-pages, deploy]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-site
          path: release
      - name: Attach the static site and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/opencv-weblab-static.tar.gz release/SHA256SUMS --clobber

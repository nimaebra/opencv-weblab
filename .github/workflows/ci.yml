name: Validate Roveran
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: roveran
          POSTGRES_USER: roveran
          POSTGRES_PASSWORD: roveran
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U roveran"
          --health-interval 5s --health-timeout 3s --health-retries 10
      storage:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: roveran-local
          RUSTFS_SECRET_KEY: roveran-local-secret
        ports: ['9000:9000']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test:integration
      - run: pip install -r tests/requirements.txt
      - run: pnpm test:parity
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            test-results/
            tests/reports/
            tests/parity-report.json
